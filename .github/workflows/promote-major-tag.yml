---
# Moves the floating major tag to each stable release. The shared workflow holds
# the logic; this caller only passes the published release tag.
name: Promote Major Tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote-major-tag:
    permissions:
      contents: write
      checks: read
    uses: dryvist/.github/.github/workflows/promote-major-tag.yml@988043f3715eef914019c59b4a6083f8dcaf9956 # v1.15.0
    with:
      tag: ${{ github.event.release.tag_name }}
