---
# Moves the floating major tag to each stable release. The shared workflow holds
# the logic; this caller only passes the published release tag.
name: Promote Major Tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote-major-tag:
    permissions:
      contents: write
      checks: read
    uses: dryvist/.github/.github/workflows/promote-major-tag.yml@26e6933fbebcf11bfbe6d675f9ce7b322ffd7de9 # v1.17.0
    with:
      tag: ${{ github.event.release.tag_name }}
