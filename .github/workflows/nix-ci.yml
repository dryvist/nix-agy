name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@0aab1ddaecacea5dc9752b075e2ac10491af33bf # v1.11.3
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@0aab1ddaecacea5dc9752b075e2ac10491af33bf # v1.11.3
    with:
      runner_label: macos-latest
      all_systems: false
