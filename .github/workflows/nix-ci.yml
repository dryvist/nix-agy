name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@6d4a39e4006e374803b7a0794148575b8bfc9be1 # v1.14.0
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@6d4a39e4006e374803b7a0794148575b8bfc9be1 # v1.14.0
    with:
      runner_label: macos-latest
      all_systems: false
