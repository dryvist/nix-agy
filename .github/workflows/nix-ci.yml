name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@aeab7c1ac2a9dc807e468fc507ad5b5c1c93df8c # v1.11.4
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@aeab7c1ac2a9dc807e468fc507ad5b5c1c93df8c # v1.11.4
    with:
      runner_label: macos-latest
      all_systems: false
