name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@26e6933fbebcf11bfbe6d675f9ce7b322ffd7de9 # v1.17.0
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@26e6933fbebcf11bfbe6d675f9ce7b322ffd7de9 # v1.17.0
    with:
      runner_label: macos-latest
      all_systems: false
