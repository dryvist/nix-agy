name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@724ca0d746ad25db385c582bac77a15a65a50957 # main
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@724ca0d746ad25db385c582bac77a15a65a50957 # main
    with:
      runner_label: macos-latest
      all_systems: false
