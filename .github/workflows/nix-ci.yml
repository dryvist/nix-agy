name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@988043f3715eef914019c59b4a6083f8dcaf9956 # v1.15.0
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@988043f3715eef914019c59b4a6083f8dcaf9956 # v1.15.0
    with:
      runner_label: macos-latest
      all_systems: false
