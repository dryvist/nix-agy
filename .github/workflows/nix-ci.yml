name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@3d5ae6608afc2e30760499415a29b8e1edfe0ad7 # v1.13.0
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@3d5ae6608afc2e30760499415a29b8e1edfe0ad7 # v1.13.0
    with:
      runner_label: macos-latest
      all_systems: false
