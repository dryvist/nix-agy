name: Nix CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  linux:
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@74e4e37bd0c362dd145ad0537361084336c8ff55 # v1.14.1
    with:
      runner_label: ubuntu-latest
      all_systems: false

  macos:
    needs: linux
    uses: dryvist/.github/.github/workflows/_nix-validate.yml@74e4e37bd0c362dd145ad0537361084336c8ff55 # v1.14.1
    with:
      runner_label: macos-latest
      all_systems: false
